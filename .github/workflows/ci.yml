name: CI/CD Pipeline (Enterprise Grade)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-sast:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for Gitleaks history scan

    - name: Gitleaks Secrets Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Semgrep SAST Scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: "p/javascript" # Scan for JS/Node.js vulnerabilities and bad patterns

  test-and-audit:
    runs-on: ubuntu-latest
    environment: staging
    needs: security-sast # Do not run tests if security scan fails
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Run NPM Audit (Dependency Scanning)
      run: npm audit --audit-level=high
      continue-on-error: false

    - name: Run Integration & Unit Tests
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        DATABASE_URL_GOVERNANCE: ${{ secrets.DATABASE_URL_GOVERNANCE }}
        DATABASE_URL_SECURITY: ${{ secrets.DATABASE_URL_SECURITY }}
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        GOVERNANCE_HMAC_SECRET: ${{ secrets.GOVERNANCE_HMAC_SECRET }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        TRUNKIA_API_KEY: ${{ secrets.TRUNKIA_API_KEY }}
        DATABASE_URL_LEARNING: ${{ secrets.DATABASE_URL_LEARNING }}
        DATABASE_URL_INTELLIGENCE: ${{ secrets.DATABASE_URL_INTELLIGENCE }}
      run: npx vitest run
