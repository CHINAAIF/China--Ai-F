version: '3.8'

services:
  trunkia-api:
    build: .
    container_name: trunkia-app
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env.production
    depends_on:
      - redis
    networks:
      - trunkia-net

  redis:
    image: redis:7-alpine
    container_name: trunkia-redis
    restart: unless-stopped
    # تمكين.Persistence لضمان عدم فقدان المهام عند إعادة التشغيل
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - trunkia-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: trunkia-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - trunkia-api
    networks:
      - trunkia-net

networks:
  trunkia-net:
    driver: bridge

volumes:
  redis-data:
