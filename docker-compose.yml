version: '3.8'

services:
  app:
    build: .
    container_name: trunkia_core
    expose:
      - "9090"
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=production
      - PORT=9090
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    networks:
      - sovereign_net

  proxy:
    image: nginx:alpine
    container_name: trunkia_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - sovereign_net

networks:
  sovereign_net:
    driver: bridge
