version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: trunkia_db
    env_file:
      - .env.docker
    command: >
      postgres 
      -c shared_buffers=128MB 
      -c work_mem=4MB 
      -c max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sovereign-bootstrap.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - data_net

  redis:
    image: redis:7-alpine
    container_name: trunkia_redis
    command: >
      sh -c "redis-server --appendonly yes --requirepass $${REDIS_PASSWORD}"
    env_file:
      - .env.docker
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - data_net

  app:
    build: .
    container_name: trunkia_core
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - PORT=9090
      - DATABASE_URL=postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@db:5432/$${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - data_net
      - proxy_net

  proxy:
    image: nginx:alpine
    container_name: trunkia_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy_net

volumes:
  pgdata:
  redisdata:

networks:
  data_net:
    internal: true
  proxy_net:
    driver: bridge
